apiVersion: v1
kind: ServiceAccount
metadata:
  name: pdf-webapp-sa
  namespace: default
  annotations:
    iam.gke.io/gcp-service-account: pdf-fanout-gsa@gke-llm-testing-env.iam.gserviceaccount.com
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pdf-job-manager-role
  namespace: default
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pdf-job-manager-binding
  namespace: default
subjects:
  - kind: ServiceAccount
    name: pdf-webapp-sa
    namespace: default
roleRef:
  kind: Role
  name: pdf-job-manager-role
  apiGroup: rbac.authorization.k8s.io
