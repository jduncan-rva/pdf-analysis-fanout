apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pdf-sqlite-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pdf-webapp
  namespace: default
  labels:
    app: pdf-webapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pdf-webapp
  template:
    metadata:
      labels:
        app: pdf-webapp
    spec:
      serviceAccountName: pdf-webapp-sa
      containers:
        - name: webapp
          image: us-central1-docker.pkg.dev/gke-llm-testing-env/pdf-fanout-repo/pdf-webapp:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: DB_PATH
              value: "/data/pdf_fanout.db"
            - name: INGEST_IMAGE
              value: "us-central1-docker.pkg.dev/gke-llm-testing-env/pdf-fanout-repo/pdf-ingest-job:latest"
            - name: ANALYSIS_IMAGE
              value: "us-central1-docker.pkg.dev/gke-llm-testing-env/pdf-fanout-repo/pdf-analysis-job:latest"
            - name: DATA_BUCKET
              value: "gke-llm-testing-env-pdf-data"
            - name: WEBAPP_URL
              value: "http://pdf-webapp-service:8000"
            - name: K8S_NAMESPACE
              value: "default"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          volumeMounts:
            - name: db-storage
              mountPath: /data
      volumes:
        - name: db-storage
          persistentVolumeClaim:
            claimName: pdf-sqlite-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: pdf-webapp-service
  namespace: default
spec:
  type: LoadBalancer
  selector:
    app: pdf-webapp
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
