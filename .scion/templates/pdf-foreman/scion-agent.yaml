schema_version: "1"
description: "Foreman orchestrator for parallel PDF fanout processing and synthesis"
default_harness_config: antigravity
user: scion
model: gemini-3.1-pro-low
agent_instructions: agents.md
system_prompt: system-prompt.md

env:
  GOOGLE_CLOUD_LOCATION: "global"
  GOOGLE_CLOUD_REGION: "global"
  FARMTABLE_SERVER: "farmtable.scion-system.svc.cluster.local:8080"
  FARMTABLE_INSECURE: "1"
  SCION_HUB_ENDPOINT: "http://scion-hub.scion-system.svc.cluster.local:8080"


telemetry:
  enabled: true
  hub:
    enabled: true
    report_interval: "10s"
  local:
    enabled: true
    console: true

resources:
  requests:
    cpu: "1000m"
    memory: "1Gi"
